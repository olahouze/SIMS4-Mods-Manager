[project]
name = "sims4-mods-manager"
version = "0.1.0"
description = "Modern Sims 4 Mod Manager with multi-site catalog, anti-bot handling, and update tracking"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "PySide6>=6.7.0",
    "playwright>=1.44.0",
    "curl_cffi>=0.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "sqlalchemy>=2.0.0",
    "py7zr>=0.21.0",
    "rarfile>=4.1",
    "python-dateutil>=2.9.0",
    "pydantic>=2.7.0",
    "qtawesome>=1.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14.0",
    "interrogate>=1.7.0",
    "mypy>=1.10.0",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

[tool.mypy]
python_version = "3.12"
plugins = ["sqlalchemy.ext.mypy.plugin"]
files = ["src/domain", "src/infrastructure", "src/core", "src/application", "src/api"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = true
ignore-private = true
ignore-property-decorators = true
ignore-module = false
ignore-nested-functions = true
ignore-nested-classes = true
fail-under = 80
exclude = ["tests", "documentation", "scripts", "docs"]
verbose = 1
quiet = false
color = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["E402"]

[tool.pytest.ini_options]
addopts = "--capture=sys"
filterwarnings = [
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore:.*httpx2.*",
    "ignore:.*BlockingPortal.*",
    "ignore::DeprecationWarning",
    "ignore::Warning:fastapi.*",
    "ignore::Warning:starlette.*",
]

