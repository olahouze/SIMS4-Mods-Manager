[project]
name = "sims4-mods-manager"
version = "0.1.0"
description = "Modern Sims 4 Mod Manager with multi-site catalog, anti-bot handling, and update tracking"
readme = "README.md"
requires-python = ">=3.11, <3.14"
dependencies = [
    "PySide6>=6.7.0",
    "playwright>=1.44.0",
    "curl_cffi>=0.7.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "sqlalchemy>=2.0.0",
    "py7zr>=0.21.0",
    "rarfile>=4.1",
    "python-dateutil>=2.9.0",
    "pydantic>=2.7.0",
    "qtawesome>=1.3.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["E402"]
